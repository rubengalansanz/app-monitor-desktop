[package]
name = "app-monitor"
version = "0.1.0"
description = "App Monitor - monitorización de uso de aplicaciones"
authors = ["you"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Win32 API bindings de bajo nivel. `windows-sys` 0.52 expone GetForegroundWindow,
# OpenProcess, GetModuleBaseNameW, CreateWindowExW, GetMessageW y WTSRegisterSessionNotification.
# LASTINPUTINFO/GetLastInputInfo los declaramos manualmente (ver windows.rs) porque
# esta versión no los expone bajo SystemInformation.
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_RemoteDesktop",
    "Win32_System_LibraryLoader",
] }
